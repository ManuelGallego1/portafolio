# Secrets have no defaults: copy .env.example to .env and fill it in first.
services:
  db:
    image: postgres:16-alpine
    container_name: portafolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-portafolio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  backend:
    build:
      context: ./backend
    container_name: portafolio-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-portafolio}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://alejandrogallego.dev}
    # Only reachable from this machine; the public entry point is the frontend proxy.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8090}:8000"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    container_name: portafolio-frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 384M }

volumes:
  pgdata:
